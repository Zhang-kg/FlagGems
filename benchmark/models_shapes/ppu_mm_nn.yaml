# Representative contiguous row-major PPU GEMMs selected from shape-config.
# The leading B field is kept for compatibility with BlasBenchmark; torch.mm
# itself consumes M, N and K.
mm:
  shapes:
    # High-frequency projection families.
    - [1, 4, 31040, 4096]
    - [1, 4, 248320, 2048]
    - [1, 4, 20480, 7168]
    - [1, 4, 16160, 7168]
    - [1, 8, 31040, 4096]
    - [1, 8, 248320, 2048]
    - [1, 8, 20480, 7168]
    - [1, 8, 16160, 7168]
    - [1, 64, 31040, 4096]
    - [1, 64, 248320, 2048]
    - [1, 64, 20480, 7168]
    - [1, 64, 16160, 7168]
    - [1, 100, 31040, 4096]
    - [1, 100, 248320, 2048]
    - [1, 100, 20480, 7168]
    - [1, 100, 16160, 7168]

    # Large model GEMMs.
    - [1, 16384, 2560, 4096]
    - [1, 16384, 512, 4096]
    - [1, 16384, 256, 4096]
    - [1, 16384, 4096, 1024]
    - [1, 16384, 4096, 128]
    - [1, 16384, 16, 4096]
    - [1, 16384, 2048, 512]
    - [1, 16384, 1024, 2048]
    - [1, 16384, 2048, 4096]
    - [1, 16384, 64, 2048]
    - [1, 16384, 12288, 2048]
    - [1, 16384, 7168, 1024]
    - [1, 16384, 64, 7168]
    - [1, 16384, 9216, 2048]
    - [1, 16384, 256, 7168]
    - [1, 16384, 384, 7168]
    - [1, 16384, 2112, 7168]
    - [1, 16384, 512, 7168]
    - [1, 16384, 1536, 1536]
    - [1, 16384, 7168, 256]

    # Medium and irregular-M families.
    - [1, 32, 384, 7168]
    - [1, 144, 4096, 1024]
    - [1, 144, 512, 4096]
    - [1, 336, 7168, 1024]
    - [1, 400, 7168, 1024]
    - [1, 96, 7168, 1024]
    - [1, 384, 512, 4096]
    - [1, 112, 7168, 1024]
    - [1, 160, 7168, 1024]
    - [1, 256, 7168, 1024]
    - [1, 384, 4096, 1024]
    - [1, 512, 7168, 1024]
  shape_desc: "B, M, N, K"
