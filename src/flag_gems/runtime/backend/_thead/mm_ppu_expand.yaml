# Offline Expanded search space for the PPU row-major GEMM kernel.  The
# production Pareto list remains in ops/mm.py and is used in Default mode.
#
# The Cartesian product is intentionally bounded.  The PPU-specific config
# builder removes configurations that exceed the conservative shared-memory
# budget or require more than 128 FP32 accumulator registers per thread.
mm_ppu:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        GROUP_M: group_m
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_m:
      - 32
      - 64
      - 128
      - 256
    block_n:
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
    block_k:
      - 32
      - 64
    group_m:
      - 1
      - 2
      - 4
      - 8
    load_mode:
      # Both operands use TLE/AIU asynchronous loads.
      - 0
      # Only A uses TLE/AIU asynchronous loads.
      - 1
      # Only B uses TLE/AIU asynchronous loads.
      - 2
      # Both operands use regular Triton loads.
      - 3
    stages:
      - 2
      - 3
      - 4
      - 5
    warps:
      - 4
      - 8
  - strategy:
      FUSE_ADDMM: default
      M: default
      N: default
      K: default

# Expanded search for skinny GEMMs.  The kernel fixes its physical M dot tile
# at 16, so only N/K/load/pipeline dimensions are tunable.
mm_ppu_small_m:
  - config:
    param_map:
      META:
        BLOCK_N: block_n
        BLOCK_K: block_k
        LOAD_MODE: load_mode
      num_stages: stages
      num_warps: warps
    block_n:
      - 64
      - 128
      - 256
      - 512
    block_k:
      - 32
      - 64
    load_mode:
      - 0
      - 1
      - 2
      - 3
    stages:
      - 2
      - 3
      - 4
      - 5
    warps:
      - 4
      - 8
  - strategy:
      FUSE_ADDMM: default
      M: default
      N: default
      K: default

# Expanded search for 16 < M < 32.  BLOCK_M stays at the single legal 32-row
# tile so AABS and ConfigCache keep an identical schema.
mm_ppu_mid_m:
