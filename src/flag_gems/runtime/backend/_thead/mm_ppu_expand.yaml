# Expanded split-K spaces retain the measured candidates and add nearby legal
# tiles.  Each generated config list stays below 5,000 after legality
# filtering; runtime pruning removes shape-incompatible contiguous slices.
mm_ppu_split_k:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        SPLIT_K: split_k
        LOAD_MODE: load_mode
        INTERLEAVED: interleaved
      num_stages: stages
      num_warps: warps
    block_m: [16, 32, 64, 128]
    block_n: [64, 128, 256]
    block_k: [32, 64, 128]
    split_k: [2, 4, 6, 7, 8]
    load_mode: [0, 2, 3]
    interleaved: [false, true]
    stages: [4, 5]
    warps: [4, 8]
  - strategy:
      M: default
      N: default
      K: default

bmm_ppu_split_k:
  - config:
    param_map:
      META:
        BLOCK_M: block_m
        BLOCK_N: block_n
        BLOCK_K: block_k
        SPLIT_K: split_k
        LOAD_MODE: load_mode
        INTERLEAVED: interleaved
      num_stages: stages
      num_warps: warps
    block_m: [32, 64, 128]
    block_n: [64, 128, 256]
    block_k: [32, 64]
    split_k: [2, 4, 6, 8]
    load_mode: [0, 2, 3]
    interleaved: [false, true]
    stages: [3, 4]
    warps: [4, 8]
  - strategy:
      batch: default
      M: default
      N: default
      K: default

