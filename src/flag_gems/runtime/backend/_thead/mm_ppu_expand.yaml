      num_warps: warps
    block_m:
      - 32
    block_n:
      - 64
      - 128
      - 256
      - 512
    block_k:
      - 32
      - 64
    load_mode:
      - 0
      - 1
      - 2
      - 3
    stages:
      - 2
      - 3
      - 4
      - 5
    warps:
      - 4
      - 8
  - strategy:
      FUSE_ADDMM: default
      M: default
      N: default
      K: default

